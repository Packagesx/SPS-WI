<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Slide Show Viewer</title>
    <!-- นำเข้า Tailwind CSS สำหรับตกแต่งความสวยงาม -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- นำเข้าไลบรารี PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
        }
        /* ซ่อน Scrollbar แต่ยังเลื่อนได้ถ้าจำเป็น */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="text-white h-screen w-full flex flex-col items-center justify-center overflow-hidden relative">

    <!-- หน้าจออัปโหลดไฟล์ (จะหายไปเมื่อโหลดไฟล์สำเร็จ) -->
    <div id="upload-screen" class="absolute inset-0 flex flex-col items-center justify-center z-20 bg-slate-900 transition-opacity duration-500">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl flex flex-col items-center max-w-md text-center border border-slate-700">
            <svg class="w-16 h-16 text-blue-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
            <h1 class="text-2xl font-bold mb-2">PDF Slide Show</h1>
            <p class="text-slate-400 mb-6 text-sm">อัปโหลดไฟล์ PDF ของคุณเพื่อเริ่มการนำเสนอ</p>
            
            <label class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg shadow-lg transition-all transform hover:scale-105">
                <span>เลือกไฟล์ PDF</span>
                <input type="file" id="file-input" accept="application/pdf" class="hidden" />
            </label>
            <div id="error-msg" class="text-red-400 mt-4 text-sm hidden bg-red-900/30 p-2 rounded-md w-full"></div>
        </div>
    </div>

    <!-- พื้นที่แสดงผล PDF -->
    <div id="canvas-container" class="relative w-full h-full flex items-center justify-center hidden p-4">
        <!-- ใช้ object-contain เพื่อให้ภาพพอดีจอและไม่เสียสัดส่วน -->
        <canvas id="pdf-render" class="max-w-full max-h-full drop-shadow-2xl rounded-sm"></canvas>
    </div>
    
    <!-- แถบเครื่องมือด้านล่าง -->
    <div id="toolbar" class="absolute bottom-6 flex gap-4 bg-slate-800/90 p-3 px-6 rounded-full backdrop-blur-md shadow-2xl border border-slate-700 items-center transition-all duration-300 opacity-0 translate-y-4 hidden hover:opacity-100 group-hover:opacity-100 z-30">
        <button id="prev-btn" class="p-2 rounded-full hover:bg-slate-700 transition-colors text-slate-300 hover:text-white disabled:opacity-50 disabled:cursor-not-allowed" title="หน้าก่อนหน้า (Arrow Left)">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
        </button>
        
        <div class="text-sm font-semibold tracking-wider text-slate-300 min-w-[80px] text-center">
            <span id="page-num" class="text-white">0</span> / <span id="page-count">0</span>
        </div>
        
        <button id="next-btn" class="p-2 rounded-full hover:bg-slate-700 transition-colors text-slate-300 hover:text-white disabled:opacity-50 disabled:cursor-not-allowed" title="หน้าถัดไป (Arrow Right, Spacebar)">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
        </button>
    </div>

    <!-- โปรแกรมจัดการ PDF -->
    <script>
        // กำหนดที่อยู่ของ Worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let pdfDoc = null,
            pageNum = 1,
            pageIsRendering = false,
            pageNumIsPending = null;

        // สเกลความละเอียดของ PDF (ยิ่งสูงยิ่งชัด แต่กินสเปค)
        const scale = 2.5;
        const canvas = document.getElementById('pdf-render'),
              ctx = canvas.getContext('2d');

        const uploadScreen = document.getElementById('upload-screen');
        const canvasContainer = document.getElementById('canvas-container');
        const toolbar = document.getElementById('toolbar');
        const errorMsg = document.getElementById('error-msg');
        
        // ฟังก์ชันแสดงข้อความแจ้งเตือน
        const showError = (msg) => {
            errorMsg.textContent = msg;
            errorMsg.classList.remove('hidden');
        };

        // ฟังก์ชันเรนเดอร์หน้า PDF
        const renderPage = num => {
            pageIsRendering = true;

            // ปิดการกดปุ่มชั่วคราว
            document.getElementById('prev-btn').disabled = (num <= 1);
            document.getElementById('next-btn').disabled = (num >= pdfDoc.numPages);

            pdfDoc.getPage(num).then(page => {
                const viewport = page.getViewport({ scale });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderCtx = {
                    canvasContext: ctx,
                    viewport: viewport
                };

                page.render(renderCtx).promise.then(() => {
                    pageIsRendering = false;
                    if (pageNumIsPending !== null) {
                        renderPage(pageNumIsPending);
                        pageNumIsPending = null;
                    }
                });

                document.getElementById('page-num').textContent = num;
            });
        };

        // ตรวจสอบสถานะการเรนเดอร์ก่อนเปลี่ยนหน้า
        const queueRenderPage = num => {
            if (pageIsRendering) {
                pageNumIsPending = num;
            } else {
                renderPage(num);
            }
        };

        // ไปหน้าก่อนหน้า
        const showPrevPage = () => {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        };

        // ไปหน้าถัดไป
        const showNextPage = () => {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        };

        // จัดการเมื่อเลือกไฟล์
        document.getElementById('file-input').addEventListener('change', e => {
            const file = e.target.files[0];
            if (!file) return;
            if (file.type !== 'application/pdf') {
                showError('กรุณาอัปโหลดไฟล์นามสกุล .pdf เท่านั้น');
                return;
            }

            errorMsg.classList.add('hidden');
            const fileReader = new FileReader();
            
            fileReader.onload = function() {
                const typedarray = new Uint8Array(this.result);
                
                // อ่านไฟล์ PDF
                pdfjsLib.getDocument(typedarray).promise.then(pdfDoc_ => {
                    pdfDoc = pdfDoc_;
                    document.getElementById('page-count').textContent = pdfDoc.numPages;
                    
                    // เปลี่ยน UI
                    uploadScreen.style.opacity = '0';
                    setTimeout(() => {
                        uploadScreen.style.display = 'none';
                        canvasContainer.classList.remove('hidden');
                        toolbar.classList.remove('hidden');
                        toolbar.classList.remove('opacity-0');
                        toolbar.classList.remove('translate-y-4');
                    }, 500);

                    pageNum = 1;
                    renderPage(pageNum);
                }).catch(err => {
                    showError('เกิดข้อผิดพลาดในการอ่านไฟล์ PDF: ' + err.message);
                });
            };
            
            fileReader.readAsArrayBuffer(file);
        });

        // ควบคุมผ่านปุ่ม
        document.getElementById('prev-btn').addEventListener('click', showPrevPage);
        document.getElementById('next-btn').addEventListener('click', showNextPage);

        // ควบคุมผ่านคีย์บอร์ด
        document.addEventListener('keydown', e => {
            if (!pdfDoc) return;
            if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
                showNextPage();
            }
            if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                showPrevPage();
            }
        });

        // ทำให้แถบเครื่องมือโผล่ขึ้นมาเวลาขยับเมาส์
        let timeout;
        document.addEventListener('mousemove', () => {
            if (!pdfDoc) return;
            toolbar.style.opacity = '1';
            clearTimeout(timeout);
            timeout = setTimeout(() => {
                toolbar.style.opacity = '0';
            }, 3000); // ซ่อนแถบเครื่องมืออัตโนมัติเมื่อไม่ขยับเมาส์ 3 วินาที
        });
    </script>
</body>
</html>
